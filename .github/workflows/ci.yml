name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build CLI
        run: go build -o pystatic ./cmd/pystatic

      - name: Smoke test — run hello.pstic
        run: |
          output=$(./pystatic run examples/hello.pstic)
          echo "$output"
          echo "$output" | grep -q "Hello from PyStatic!"
          echo "$output" | grep -q "Hello, World"
          echo "Smoke test passed ✓"

      - name: Smoke test — build single file
        run: |
          ./pystatic build -o build/hello examples/hello.pstic
          output=$(./build/hello)
          echo "$output" | grep -q "Hello from PyStatic!"
          echo "Build smoke test passed ✓"
